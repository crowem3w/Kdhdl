# The ObjectBox Gradle plugin's `objectboxPrepareBuild` task holds a live
# Project reference internally, which the configuration cache can't
# serialize (long-standing upstream issue - see
# https://github.com/objectbox/objectbox-java/issues/1020, still open as
# of the version in use here). Configuration cache has to stay off while
# the ObjectBox plugin is applied, or every build fails outright rather
# than just missing the cache.
org.gradle.configuration-cache=false

android.useAndroidX=true
