org.gradle.configuration-cache=true

android.useAndroidX=true

# AGP 9.0+ enables "built-in Kotlin" by default, which registers its own
# `kotlin` extension and collides with the explicit org.jetbrains.kotlin.android
# plugin this project applies (needed for kotlin-kapt -> ObjectBox's annotation
# processor). Opt back out to the classic Kotlin Gradle plugin flow until
# kapt/ObjectBox are migrated to built-in Kotlin's model.
android.builtInKotlin=false
