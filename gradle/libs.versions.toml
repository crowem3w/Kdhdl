[versions]
agp = "9.2.0"
coreKtx = "1.19.0"
appcompat = "1.7.1"
okhttp = "4.12.0"
coroutines = "1.9.0"
lifecycleRuntimeKtx = "2.8.7"
securityCrypto = "1.1.0-alpha06"
tensorflowLite = "2.16.1"
workManager = "2.10.0"
androidxTestJunit = "1.2.1"
espressoCore = "3.6.1"
workTesting = "2.10.0"
uiautomator = "2.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
# On-device inference runtime for PolicyInferenceEngine (design doc §1.2/§3.3).
# "TensorFlow Lite" is Google's now-legacy artifact name for what's since been
# rebranded "LiteRT" (com.google.ai.edge.litert) - pinned to the org.tensorflow
# group here since it's the long-stable, still-fully-supported artifact and a
# straight package-name swap to the LiteRT group later needs no API changes.
tensorflow-lite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tensorflowLite" }
# Backs TrainingScheduler/PolicyTrainingWorker (design doc §2.2 item 2): the
# daily PPO batch-training job needs to survive process death/reboots
# between scheduled runs, which is exactly what WorkManager is for.
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
# androidTest-only: backs the Task 12 End-to-End Pipeline Resilience Test
# harness (org.example.syncora.resilience) - instrumented-test scaffolding,
# process-kill simulation, and WorkManager's TestDriver. Never pulled into
# the shipped app; see app/build.gradle.kts androidTestImplementation block.
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "workTesting" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
